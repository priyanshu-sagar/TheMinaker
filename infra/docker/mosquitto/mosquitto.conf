# mosquitto.conf — Development configuration
# Password file is created by the setup script.
# In production on Oracle/AWS, use TLS + strong passwords.

# ─── Listeners ────────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ─── Authentication ───────────────────────────────────────────
# Set to false in dev if password file doesn't exist yet
# Set to true in production ALWAYS
allow_anonymous false

# Uncomment after running: scripts/setup-mqtt-passwords.ps1
# password_file /mosquitto/config/passwd

# ─── Topic ACL ────────────────────────────────────────────────
# Conductors can only publish to their own bus topics
# Server user (NestJS) can subscribe to all
# Uncomment after running setup script:
# acl_file /mosquitto/config/acl

# ─── Persistence ─────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ─── Logging ─────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# ─── Connection Limits ────────────────────────────────────────
max_connections 500
max_inflight_messages 20
max_queued_messages 1000

# ─── Keep-alive / QoS ────────────────────────────────────────
# Conductor app uses QoS 1 (at-least-once) for GPS telemetry
keepalive_interval 60

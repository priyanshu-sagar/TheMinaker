# ─────────────────────────────────────────────────────────────────────────────
# TheMinaker — Local Development Stack
# Simulates: Aurora → timescaledb pg16, ElastiCache → Redis,
#             Amazon MQ → Mosquitto, S3 → LocalStack
#
# Usage: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL 16 + TimescaleDB + PostGIS ──────────────────
  # timescale/timescaledb:latest-pg16 = TimescaleDB community + PostGIS on PG16
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: minaker_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: minaker_dev
      POSTGRES_USER: minaker
      POSTGRES_PASSWORD: minaker_secret
      # Use md5 auth (compatible with all pg library versions including Node.js pg)
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run schema on first start
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Override pg_hba.conf for dev (trust auth — no password needed locally)
      - ./database/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minaker -d minaker_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── PgBouncer — Transaction Pooling ────────────────────────
  # CRITICAL: transaction mode is required for PostgreSQL RLS with SET LOCAL commands.
  # pgbouncer/pgbouncer is the official upstream image (bitnami/pgbouncer was deprecated).
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: minaker_pgbouncer
    restart: unless-stopped
    environment:
      # pgbouncer/pgbouncer image uses DATABASES_* env vars
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_USER: minaker
      DATABASES_PASSWORD: minaker_secret
      DATABASES_DBNAME: minaker_dev
      # Pool settings — transaction mode required for RLS SET LOCAL
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_LOG_CONNECTIONS: "0"
      PGBOUNCER_LOG_DISCONNECTIONS: "0"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Redis 7 — Cache + BullMQ Queues + Socket.io Adapter ───
  redis:
    image: redis:7-alpine
    container_name: minaker_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Eclipse Mosquitto — MQTT Broker ────────────────────────
  # Conductor publishes GPS to this broker every 5 seconds.
  # NestJS API subscribes and bridges to WebSocket for parents.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: minaker_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (TCP) — conductor mobile app
      - "9001:9001"   # MQTT over WebSocket — browser debugging
    volumes:
      - ./infra/docker/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t 'health/check' -m 'ping' 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── LocalStack — AWS S3 Simulation ─────────────────────────
  # Simulates S3 for student photos and attendance report exports.
  # Using :3 tag — last free community edition. "latest" is now Pro (paid).
  localstack:
    image: localstack/localstack:3
    container_name: minaker_localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      LOCALSTACK_HOST: localstack
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ─── Adminer — Database GUI ──────────────────────────────────
  # Open http://localhost:8080
  # Server: pgbouncer | User: minaker | Pass: minaker_secret | DB: minaker_dev
  adminer:
    image: adminer:latest
    container_name: minaker_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DESIGN: dracula
      ADMINER_DEFAULT_SERVER: pgbouncer
    depends_on:
      - pgbouncer

# ─── Named Volumes ───────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  localstack_data:
    driver: local

# ─── Network ─────────────────────────────────────────────────
networks:
  default:
    name: minaker_network
    driver: bridge
